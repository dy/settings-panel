<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leva — calibration</title>
  <!-- Replica of the Leva canonical example · ref: https://leva.pmnd.rs -->
  <script type="importmap">
  {
    "imports": {
      "sprae": "https://esm.sh/sprae@13",
      "sprae/store": "https://esm.sh/sprae@13/store"
    }
  }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; }
    html { scrollbar-width: none; }
    ::-webkit-scrollbar { display: none; }
    body {
      min-height: 100vh;
      display: flex;
      padding: 2rem;
      background: radial-gradient(120% 90% at 50% -10%, #1b1f28 0%, #0e1014 55%, #07080a 100%);
      font-size: 14px;
    }
    #panel { margin: auto; }
  </style>
</head>
<body>
  <div id="panel"></div>
  <script type="module">
    import settings from '../../index.js'
    import leva from '../../theme/leva.js'
    import { nativeToggle } from './native-toggle.js'

    settings({
      number: { type: 'slider', value: 10, min: 0, max: 100, step: 0.25, label: 'number' },
      select: { type: 'select', value: 'y', options: ['x', 'y', 'z', 'w', 'v'], label: 'select' },
      interval: { type: 'slider', multiple: true, value: [10, 15], min: -100, max: 100, step: 1, label: 'interval' },
      boolean: { type: 'boolean', variant: 'checkbox', value: true, label: 'boolean' },
      text: { type: 'text', value: 'hello', label: 'text' },
      vector2: { type: 'vector', value: ['3.0', '4.0'], labels: ['X', 'Y'], label: 'vector2' },
      speed: { type: 'number', value: 2, step: 1, label: 'speed' },
      locked: { type: 'slider', value: 5, min: 0, max: 10, step: 1, label: 'locked', disabled: true },
      action: { type: 'button', label: false, text: 'action' },
      fps: { type: 'info', value: 61.8, format: v => v.toFixed(0), label: 'fps' },
      folder2: { type: 'folder', label: 'folder2' },
      'folder2.color': { type: 'color', value: '#ff005b', label: 'color' },
      'folder2.color2': { type: 'color', value: '#ffffff', label: 'color2' },
      colorObj: { type: 'color', value: '#010203', label: 'colorObj' },
      folder3: { type: 'folder', label: 'folder3', collapsed: true },
      'folder3.scale': { type: 'slider', value: 1, min: 0.1, max: 4, step: 0.1, label: 'scale' },
      'folder3.tag': { type: 'text', value: 'v2', label: 'tag' },
    }, {
      container: '#panel',
      title: 'leva',
      search: true,
      collapsed: false,
      theme: () => leva(),
    })

    nativeToggle({ ref: '../_ref/leva-ref.html' })
  </script>
</body>
</html>
