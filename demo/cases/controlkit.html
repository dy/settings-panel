<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ControlKit — calibration</title>
  <!-- Replica of the ControlKit canonical example · ref: https://github.com/automat/controlkit.js -->
  <script type="importmap">
  {
    "imports": {
      "sprae": "https://esm.sh/sprae@13",
      "sprae/store": "https://esm.sh/sprae@13/store"
    }
  }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      display: flex;
      padding: 2rem;
      background: radial-gradient(120% 90% at 50% -10%, #454545 0%, #2b2b2b 55%, #1c1c1c 100%);
      font-size: 14px;
    }
    #panel { margin: auto; }
  </style>
</head>
<body>
  <div id="panel"></div>
  <script type="module">
    import settings from '../../index.js'
    import controlkit from '../../theme/controlkit.js'
    import { nativeToggle } from './native-toggle.js'

    settings({
      number: { type: 'text', value: '123.00', label: 'number' },
      string: { type: 'text', value: 'abc', label: 'string' },
      value: { type: 'slider', value: 0.5, min: 0, max: 1, step: 0.01, label: 'value' },
      pair: { type: 'slider', multiple: true, value: [-0.5, 0.5], min: -1, max: 1, step: 0.01, readout: 'readonly', format: v => v.toFixed(2), label: 'pair' },
      bool: { type: 'boolean', variant: 'checkbox', value: false, label: 'bool' },
      select: { type: 'select', value: 'Choose ...', options: ['Choose ...', 'A', 'B', 'C', 'D'], label: 'select' },
      color: { type: 'color', value: '#ff0000', label: 'color' },
      xyvalue: { type: 'xy', value: [0.3, 0.7], min: -1, max: 1, step: 0.01, label: 'xyvalue' },
      speed: { type: 'slider', value: 50, min: 0, max: 200, step: 1, format: v => v.toFixed(2), label: 'speed' },
      angle: { type: 'slider', value: 0, min: -180, max: 180, step: 1, format: v => v.toFixed(2), label: 'angle' },
      ratio: { type: 'slider', value: 0.5, min: 0, max: 1, step: 0.01, label: 'ratio', disabled: true },
      fps: { type: 'info', value: 60, label: 'fps' },
      note: { type: 'text', value: 'hello', label: 'note' },
      FIRE: { type: 'button', label: false, text: 'FIRE' },
      more: { type: 'folder', label: 'More' },
      'more.seed': { type: 'text', value: '7.00', label: 'seed' },
    }, {
      container: '#panel',
      title: 'ControlKit',
      collapsed: false,
      theme: () => controlkit(),
    })

    nativeToggle({ ref: '../_ref/ck-ref.html' })
  </script>
</body>
</html>
