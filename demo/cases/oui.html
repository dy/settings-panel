<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oui — calibration</title>
  <!-- Replica of the oui example · ref: https://github.com/wearekuva/oui -->
  <script type="importmap">
  {
    "imports": {
      "sprae": "https://esm.sh/sprae@13",
      "sprae/store": "https://esm.sh/sprae@13/store"
    }
  }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; }
    html { scrollbar-width: none; }
    ::-webkit-scrollbar { display: none; }
    body {
      min-height: 100vh;
      display: flex;
      padding: 2rem;
      background: radial-gradient(120% 90% at 50% -10%, #313134 0%, #1d1d1f 55%, #101012 100%);
      font-size: 14px;
    }
    #panel { margin: auto; }
  </style>
</head>
<body>
  <div id="panel"></div>
  <script type="module">
    import settings from '../../index.js'
    import oui from '../../theme/oui.js'
    import { nativeToggle } from './native-toggle.js'

    settings({
      someNum: { type: 'slider', value: 10, min: 0, max: 100, step: 1, label: 'someNum' },
      amount: { type: 'slider', value: 42, min: 0, max: 100, step: 1, label: 'amount' },
      speed: { type: 'slider', value: 75, min: 0, max: 100, step: 1, label: 'speed' },
      enabled: { type: 'boolean', variant: 'checkbox', value: true, label: 'enabled' },
      visible: { type: 'boolean', variant: 'checkbox', value: false, label: 'visible' },
      tint: { type: 'color', value: '#ff5252', label: 'tint' },
      accent: { type: 'color', value: '#4287f5', label: 'accent' },
      label: { type: 'text', value: 'hello', label: 'label' },
      mode: { type: 'text', value: 'soft', label: 'mode' },
      dir: { type: 'folder', label: 'dir', collapsed: true },
      'dir.someNestedProp': { type: 'slider', value: 10, min: 0, max: 100, step: 1, label: 'someNestedProp' },
      'dir.active': { type: 'boolean', variant: 'checkbox', value: true, label: 'active' },
      actions: { type: 'button', label: false, buttons: { apply: () => {}, reset: () => {} } },
    }, {
      container: '#panel',
      title: 'Master',
      collapsed: false,
      theme: () => oui(),
    })

    nativeToggle({ ref: '../_ref/oui-ref.html' })
  </script>
</body>
</html>
