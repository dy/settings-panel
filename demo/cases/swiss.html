<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swiss — Coworking</title>
  <!-- Replica of the coworking sign-up pair in swiss.png: a newsletter form and the Be In Cahoots form,
       each on its half of a two-tone page over a photographed Swiss flag -->
  <script type="importmap">
  {
    "imports": {
      "sprae": "https://esm.sh/sprae@13",
      "sprae/store": "https://esm.sh/sprae@13/store"
    }
  }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&family=Pinyon+Script&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html { height: 100%; scrollbar-width: none; }
    ::-webkit-scrollbar { display: none; }
    body { min-height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); font-size: 14px; position: relative; background: #25262a; }
    /* The photograph, traced in the reference's own tones (658 × 410): a flag on its pole, dark, its
       cross catching a little light, a lit floor below it; softened as the photo is. */
    .backdrop { position: fixed; inset: 0; z-index: -1; background: var(--photo) center / cover no-repeat; }
    /* The right half is the same photograph under a pale veil (the reference's 37 → 78 grey) */
    .backdrop::after { content: ''; position: absolute; inset: 0 0 0 50%; background: rgb(253 233 255 / .19); }
    .half { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 4rem 1rem; }
    .half > div { width: min(100%, 340px); }
    /* the script flourish behind each title */
    .s-panel-title { position: relative; isolation: isolate; }
    .flourish { position: absolute; z-index: -1; left: 50%; top: 50%; translate: -38% -62%; font: 400 64px/1 'Pinyon Script', cursive; color: rgb(255 255 255 / .2); white-space: nowrap; text-transform: none; letter-spacing: 0; pointer-events: none; }
    /* the newsletter's key is two thirds of its form, centred */
    [data-key=signup] { padding-inline: 17% !important; }
    @media (max-width: 760px) { body { grid-template-columns: 1fr; } .backdrop::after { inset: 50% 0 0 0; } }
  </style>
</head>
<body>
  <div class="backdrop"></div>
  <section class="half"><div id="know"></div></section>
  <section class="half"><div id="cahoots"></div></section>
  <script type="module">
    import settings from '../../index.js'
    import swiss from '../../theme/swiss.js'

    const titleFont = `'Oswald', 'Arial Narrow', sans-serif`
    const labelFont = `'DM Sans', 'Helvetica', sans-serif`
    const valueFont = `'DM Serif Display', 'Georgia', serif`

    // the photograph, in reference pixels
    const shapes = [
      ['#28282d', '28,0 98,0 98,410 28,410'],                         // the pole's lit face
      ['#1c1e22', '28,0 32,0 32,410 28,410'],                         // its edge
      ['#1c2024', '98,0 330,0 330,88 585,130 572,290 625,410 330,410 330,345 98,330'], // the flag
      ['#14181c', '98,0 140,0 140,330 98,330'],                       // its fold by the pole
      ['#26272b', '30,320 205,334 140,410 30,410'],                   // the lit floor
      ['#26282c', '265,128 300,131 302,246 268,243'],                 // the cross: upright
      ['#26282c', '222,158 330,166 330,210 222,205'],                 //   arm
      ['#25272b', '380,181 462,189 462,219 380,213'],                 //   arm, beyond the fold
    ]
    const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 658 410' preserveAspectRatio='xMidYMid slice'><filter id='f'><feGaussianBlur stdDeviation='2.2'/></filter><rect width='658' height='410' fill='#25262a'/><g filter='url(#f)'>${shapes.map(([c, p]) => `<polygon fill='${c}' points='${p}'/>`).join('')}</g></svg>`
    document.querySelector('.backdrop').style.setProperty('--photo', `url("data:image/svg+xml,${encodeURIComponent(svg)}")`)

    const form = (container, title, flourish, subtitle, schema) => {
      settings(schema, { container, theme: () => swiss({ titleFont, labelFont, valueFont, size: 15 / 13, spacing: 1.2 }), title })
      const head = container.querySelector('.s-panel-title')
      head.insertAdjacentHTML('beforeend', `<span class="flourish" aria-hidden="true">${flourish}</span>`)
      const sub = document.createElement('div')
      sub.className = 's-subtitle'
      sub.style.fontFamily = valueFont
      sub.textContent = subtitle
      head.after(sub)
    }

    form(document.getElementById('know'), 'Be in the Know', 'Know', 'Sign up for our newsletter to stay in the know.', {
      name: { type: 'text', value: 'John Smith', label: 'Name' },
      email: { type: 'text', value: 'john@example.com', label: 'Email' },
      signup: { type: 'button', label: false, text: 'Sign Up', onClick: () => {} },
    })

    form(document.getElementById('cahoots'), 'Be in Cahoots', 'Cahoots', 'Send us some info about yourself to get started.', {
      company: { type: 'text', value: 'Acme Co.', label: 'Company' },
      name: { type: 'text', value: 'John Smith', label: 'Name' },
      email: { type: 'text', value: 'john@example.com', label: 'Email' },
      phone: { type: 'text', value: '555-555-5555', label: 'Phone' },
      desks: { type: 'number', value: 1, min: 1, max: 50, label: 'Number of Desks Needed', style: '--label-w: 72%' },
      founder: { type: 'select', variant: 'segmented', value: 'Yes', options: ['No', 'Yes'], label: 'Startup Founder?', style: '--label-w: 72%' },
      needs: {
        type: 'select', variant: 'checkboxes', multiple: true, value: ['myself'],
        options: [
          { value: 'startup', label: 'A Space For My Startup' },
          { value: 'myself', label: 'A Space For Myself' },
          { value: 'membership', label: 'General Membership' },
          { value: 'events', label: 'A Space For Events' },
        ],
        label: 'Check All That Apply', style: '--label-w: 40%',
      },
      submit: { type: 'button', label: false, text: 'Send My Info', onClick: () => {} },
    })
  </script>
</body>
</html>
