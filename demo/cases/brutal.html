<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brutal — Neobrutalism</title>
  <script type="importmap">
  {
    "imports": {
      "sprae": "https://esm.sh/sprae@13",
      "sprae/store": "https://esm.sh/sprae@13/store"
    }
  }
  </script>
  <style>
    html { scrollbar-width: none; }
    ::-webkit-scrollbar { display: none; }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      display: flex;
      background: radial-gradient(120% 90% at 50% -10%, #4d453c 0%, #292420 55%, #161310 100%);
      padding: 2rem;
      font-size: 14px;
    }
    #panel { width: min(100%, 360px); margin: auto; }
  </style>
</head>
<body>
  <div id="panel"></div>
  <script type="module">
    import settings from '../../index.js'
    import brutal from '../../theme/brutal.js'

    settings({
      name: { type: 'text', value: 'Cumulus Steve', label: 'Name' },
      size: { type: 'select', variant: 'segmented', value: 'M', options: ['S', 'M', 'L'], label: 'Size' },
      fluffiness: { type: 'slider', value: 0.7, min: 0, max: 1, label: 'Fluffiness' },
      altitude: { type: 'slider', value: 3000, min: 0, max: 12000, step: 500, label: 'Altitude', unit: 'm' },
      drifting: { type: 'boolean', variant: 'switch', value: true, label: 'Drifting' },
      ominous: { type: 'boolean', variant: 'checkbox', value: false, label: 'Ominous' },
      tint: { type: 'color', value: '#ff5a5f', label: 'Tint' },
      shapes: { type: 'select', variant: 'checkboxes', multiple: true, value: ['dog'], options: ['dog', 'dragon', 'face'], label: 'Looks like' },
      forecast: { type: 'folder', label: 'Forecast', collapsed: true },
      'forecast.lifespan': { type: 'number', value: 6, min: 1, max: 48, label: 'Lifespan', unit: 'h' },
      rain: { type: 'button', label: false, text: 'Make it rain' },
    }, {
      container: '#panel',
      title: 'Cloud',
      collapsed: false,
      search: true,
      theme: () => brutal(),
    })
  </script>
</body>
</html>
