<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uil — calibration</title>
  <!-- Replica of the uil canonical example · ref: https://lo-th.github.io/uil/ -->
  <script type="importmap">
  {
    "imports": {
      "sprae": "https://esm.sh/sprae@13",
      "sprae/store": "https://esm.sh/sprae@13/store"
    }
  }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      display: flex;
      padding: 2rem;
      background: radial-gradient(120% 90% at 50% -10%, #34353a 0%, #1f2024 55%, #131316 100%);
      font-size: 14px;
    }
    #panel {
      position: relative;
      margin: auto;
    }
  </style>
</head>
<body>
  <div id="panel"></div>
  <script type="module">
    import settings from '../../index.js'
    import uil from '../../theme/uil.js'
    import { nativeToggle } from './native-toggle.js'

    settings({
      Bool_v: { type: 'boolean', variant: 'switch', value: false, label: 'Bool_v' },
      Color_v: { type: 'color', value: '#ffffff', label: 'Color_v', formatText: v => `0x${v.replace(/^#/, '').toUpperCase()}`, parseText: v => `#${v.replace(/^0x/i, '').replace(/^#/, '')}` },
      Color: { type: 'color', value: '#00ffff', label: 'Color', formatText: v => `0x${v.replace(/^#/, '').toUpperCase()}`, parseText: v => `#${v.replace(/^0x/i, '').replace(/^#/, '')}` },
      Slide_v: { type: 'slider', value: 20, min: -100, max: 100, step: 1, label: 'Slide_v' },
      Slide: { type: 'slider', value: 0.4, min: -1, max: 1, step: 0.01, format: v => String(+v.toFixed(2)), label: 'Slide' },
      Slide2: { type: 'slider', value: 0.6, min: -1, max: 1, step: 0.01, format: v => String(+v.toFixed(2)), label: 'Slide', style: '--slide:#d4b87b' },
      String: { type: 'text', value: 'welcome to uil', label: 'String' },
      List: { type: 'select', value: 'Box', options: ['Box', 'Sphere', 'Cone', 'Torus'], label: 'List' },
      Number: { type: 'number', value: 70, min: -60, max: 200, label: 'Number' },
      Locked: { type: 'number', value: 42, min: 0, max: 100, label: 'Locked', disabled: true },
      Sel: { type: 'select', variant: 'segmented', value: '', options: ['A', 'B', 'C'], label: 'Sel' },
      Knob: { type: 'knob', value: 40, min: 0, max: 100, label: 'Knob' },
      Pad: { type: 'xy', value: [0.2, 0.5], min: [-1, 1], max: [1, -1], readout: true, format: ([x, y]) => +x.toFixed(2) + ',' + +y.toFixed(2), label: 'Pad' },
      More: { type: 'folder', label: 'More' },
      'More.Inside': { type: 'boolean', variant: 'switch', value: true, label: 'Inside' },
      Files: { type: 'button', variant: 'group', label: 'Files', buttons: { LOAD: () => {}, SAVE: () => {} } },
    }, {
      container: '#panel',
      title: 'UIL',
      theme: () => uil(),
      collapsed: false,
    })

    nativeToggle({ ref: '../_ref/uil-ref.html' })
  </script>
</body>
</html>
