<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Materials – Settings Panel</title>
  <script type="importmap">
    { "imports": { "sprae": "https://esm.sh/sprae@13", "sprae/store": "https://esm.sh/sprae@13/store" } }
  </script>
  <style>
    /* The four material themes of the study they reproduce, in one of its finishes at a time (the bar's
       switch): the page is the finish's surface; first the study itself, a row of keys per theme (a round
       icon key and a pill) on the bare surface, then a panel per theme. */
    * { box-sizing: border-box; margin: 0; }
    html { scrollbar-width: none; }
    ::-webkit-scrollbar { display: none; }
    body { min-height: 100vh; display: grid; place-items: safe center; padding: 56px 24px 40px; font: 13px/1.5 system-ui, sans-serif; color: var(--caption); }
    main { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 340px)); justify-content: center; gap: 40px 32px; width: 100%; max-width: 760px; margin: auto; }
    .cell { display: grid; gap: 10px; align-content: start; }
    .cell > p { font-size: 11px; letter-spacing: .02em; }
    /* the study's rows, in its proportions to a key's height h (measured on the graphite study): the round key
       h across, .79h to the pill, the pill 3.27h long, a row every 1.93h. Its keys are one size, h = 36px (--study-h), their
       lettering the study's 14px; they lie on the bare surface, each row's panel keeping its theme's controls
       and dropping its plate */
    #study { --study-h: 36px; display: grid; justify-items: center; margin-bottom: 72px; }
    #study .s-panel { background: none !important; box-shadow: none !important; border: 0 !important; padding: 0 !important; backdrop-filter: none !important; width: auto !important; min-width: 0 !important; max-width: none !important; &::before, &::after { display: none !important; } }
    #study .s-panel-content { padding: 0 !important; }
    #study .s-control { padding: 0 !important; min-height: 0 !important; background: none !important; border: 0 !important; }
    #study .s-input { gap: calc(var(--study-h) * .79) !important; }
    #study .s-button button { height: var(--study-h) !important; min-height: 0 !important; }
    #study .s-button button:not(.s-icon-only) { flex: none !important; width: calc(var(--study-h) * 3.27) !important; }
    #study > div + div { margin-top: calc(var(--study-h) * .93); }
    #study .s-icon { width: 1.6em; height: 1.6em; }
  </style>
</head>
<body>
  <div>
    <section id="study"></section>
    <main id="main"></main>
  </div>
  <script type="module">
    import settings from '../../index.js'
    import { byId, colormaps, material } from '../themes.js'
    import { surface } from '../../theme/texture.js'
    import { caseBar, appearance } from './case-bar.js'

    const finishes = { chalk: 'Chalk', bronze: 'Bronze', graphite: 'Graphite' }
    const rows = ['neu', 'glass', 'soft', 'skeu']
    const main = document.getElementById('main'), study = document.getElementById('study')
    let panels = []

    // The study's glyphs: a body at part strength, its sparkle at full, both in the key's ink
    const icon = (body, spark = '') => `<svg viewBox="0 0 24 24" fill="currentColor">${body}${spark}</svg>`
    const sparkle = (x, y, r) => `<path d="M${x} ${y - r}C${x + r * .18} ${y - r * .18} ${x + r * .18} ${y - r * .18} ${x + r} ${y}C${x + r * .18} ${y + r * .18} ${x + r * .18} ${y + r * .18} ${x} ${y + r}C${x - r * .18} ${y + r * .18} ${x - r * .18} ${y + r * .18} ${x - r} ${y}C${x - r * .18} ${y - r * .18} ${x - r * .18} ${y - r * .18} ${x} ${y - r}Z"/>`
    const glyphs = {
      Search: icon(`<g opacity=".55" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14.2 9.6a5.6 5.6 0 1 1-4.6-4.9"/><path d="m14.4 14.4 4.6 4.6"/></g>`, sparkle(16.5, 5.5, 4.2)),
      Think: icon(`<path opacity=".55" d="M12.4 2.8c4.3 0 7.4 3 7.4 7 0 1 .9 2.2 1.6 3.1.4.5.1 1.2-.5 1.3l-1.3.3v2.6c0 1-.8 1.8-1.8 1.8h-2v2.3c0 .5-.4.8-.8.8H8.4c-.5 0-.8-.4-.8-.8v-3.3c-2.1-1.3-3.5-3.6-3.5-6.2 0-4 3.6-8.9 8.3-8.9Z"/>`, sparkle(11.6, 9.6, 3.8)),
      Upgrade: icon(`<path opacity=".55" d="M6.7 3.5h10.6l4.2 5.2-9.5 12-9.5-12Z"/>`, sparkle(12, 10.2, 4)),
      Customize: icon(`<path opacity=".4" d="M12 2.5 20.5 7.3v9.4L12 21.5 3.5 16.7V7.3Z"/><path opacity=".75" d="M12 12 20.5 7.3v9.4L12 21.5Z"/><path d="M12 7.6 15.8 9.8 12 12 8.2 9.8Z"/>`),
    }
    const words = ['Search', 'Think', 'Upgrade', 'Customize']

    const show = id => {
      panels.forEach(p => p[Symbol.dispose]())
      main.replaceChildren()
      study.replaceChildren()
      const map = colormaps[id], t = surface(map.texture, map.shade)
      document.body.style.background = t ? `${t.image}, ${map.shade}` : map.shade
      document.body.style.backgroundBlendMode = t ? `${t.blend}, normal` : ''
      document.body.style.setProperty('--caption', map.ink)
      const keys = rows.map((themeId, i) => {
        const theme = byId[themeId], axes = { ...material(theme, colormaps[id]), accent: colormaps[id].accent, size: 14 / 13 }
        return settings({ keys: { type: 'button', label: false, buttons: [{ icon: glyphs[words[i]], name: words[i], onClick() {} }, { text: words[i], onClick() {} }] } },
          { container: study.appendChild(document.createElement('div')), theme: theme.fn(axes) })
      })
      panels = [...keys, ...rows.map(themeId => {
        // size: the study's themes set their body at 14px; 14 / 13 draws them at it
        const theme = byId[themeId], axes = { ...material(theme, map), accent: map.accent, size: 14 / 13 }
        const cell = main.appendChild(document.createElement('div'))
        cell.className = 'cell'
        const host = cell.appendChild(document.createElement('div'))
        cell.insertAdjacentHTML('beforeend', `<p>${theme.name} / ${map.name}</p>`)
        const panel = settings({
          preset: { type: 'select', value: 'Daylight', options: ['Daylight', 'Overcast', 'Evening'], label: 'Preset' },
          name: { type: 'text', value: 'Aurora', label: 'Name' },
          exposure: { type: 'slider', value: .35, min: -2, max: 2, step: .05, label: 'Exposure', unit: ' EV' },
          quality: { type: 'select', variant: 'segmented', value: 'Fine', options: ['Draft', 'Fine', 'Ultra'], label: 'Quality' },
          enabled: { type: 'boolean', variant: 'switch', value: true, label: 'Preview' },
          actions: { type: 'button', label: false, buttons: {
            Reset: { variant: 'secondary', onClick: () => Object.assign(panel, { preset: 'Daylight', name: 'Aurora', exposure: .35, quality: 'Fine', enabled: true }) },
            Save: { onClick() {} },
          } },
        }, { container: host, title: theme.name, collapsed: false, theme: theme.fn(axes) })
        return panel
      })]
    }

    show(appearance('chalk', finishes))
    caseBar({ appearance: 'chalk', modes: finishes, onAppearance: show })
  </script>
</body>
</html>
