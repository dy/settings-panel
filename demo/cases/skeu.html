<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skeu</title>
  <script type="importmap">
  {
    "imports": {
      "sprae": "https://esm.sh/sprae@13",
      "sprae/store": "https://esm.sh/sprae@13/store"
    }
  }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; }
    html { scrollbar-width: none; }
    ::-webkit-scrollbar { display: none; }
    body {
      min-height: 100vh;
      display: flex;
      /* The page is the material the panel is cut from: its surface and texture follow the finish */
      background-color: #ca9d63;
      padding: 2rem 1rem;
      font-size: 13px;
    }
    #panel {
      width: min(100%, 360px);
      margin: auto;
    }
  </style>
</head>
<body>
  <div id="panel"></div>
  <script type="module">
    import settings from '../../index.js'
    import skeu from '../../theme/skeu.js'
    import { surface } from '../../theme/texture.js'
    import { colormaps } from '../themes.js'

    // The three finishes of the material study the theme is calibrated on
    const finishes = { Chalk: colormaps.chalk, Bronze: colormaps.bronze, Graphite: colormaps.graphite }
    const material = ({ finish, depth, bevel }) => {
      const { shade, accent, ink, texture } = finishes[finish]
      return { shade, accent, ink, texture, depth, bevel, size: 14 / 13 }
    }
    const ground = finish => {
      const { shade, texture } = finishes[finish], t = surface(texture, shade)
      document.body.style.background = t ? `${t.image}, ${shade}` : shade
      document.body.style.backgroundBlendMode = t ? `${t.blend}, normal` : ''
    }
    ground('Chalk')

    settings({
      name: { type: 'text', value: 'Walnut desk', label: 'Name' },
      preset: { type: 'select', value: 'Daylight', options: ['Daylight', 'Overcast', 'Evening'], label: 'Preset' },
      exposure: { type: 'slider', value: .35, min: -2, max: 2, step: .05, label: 'Exposure', unit: ' EV' },
      quality: { type: 'select', variant: 'segmented', value: 'Fine', options: ['Draft', 'Fine', 'Ultra'], label: 'Quality' },
      preview: { type: 'boolean', variant: 'switch', value: true, label: 'Preview' },
      grid: { type: 'boolean', variant: 'checkbox', value: false, label: 'Grid' },
      tint: { type: 'color', value: '#c8643c', label: 'Tint' },
      more: { type: 'folder', label: 'Output', collapsed: true },
      'more.copies': { type: 'number', value: 2, min: 1, max: 9, label: 'Copies' },
      'more.format': { type: 'select', variant: 'radio', value: 'PNG', options: ['PNG', 'JPEG'], label: 'Format' },
      material: { type: 'folder', label: 'Material', collapsed: false },
      'material.finish': { type: 'select', variant: 'segmented', value: 'Chalk', options: Object.keys(finishes), label: 'Finish' },
      'material.depth': { type: 'slider', value: 1, min: 0, max: 2, step: .1, label: 'Depth' },
      'material.bevel': { type: 'slider', value: 1, min: 0, max: 2, step: .1, label: 'Edges' },
      actions: { type: 'button', label: false, buttons: { Reset: { variant: 'secondary', onClick() {} }, Render: { onClick() {} } } },
    }, {
      container: '#panel',
      title: 'Studio light',
      collapsed: false,
      theme: s => skeu(material(s)),
      onchange: s => ground(s.finish),
    })
  </script>
</body>
</html>
