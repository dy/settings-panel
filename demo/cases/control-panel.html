<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Panel</title>
  <script type="importmap">
  {
    "imports": {
      "sprae": "https://esm.sh/sprae@13",
      "sprae/store": "https://esm.sh/sprae@13/store"
    }
  }
  </script>
  <link href="https://cdn.jsdelivr.net/npm/hack-font@3.3.0/build/web/hack.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      display: flex;
      background: radial-gradient(120% 90% at 50% -10%, #2e2e2e 0%, #1a1a1a 55%, #0f0f0f 100%);
      padding: 2rem;
      font-size: 11px;
    }
    #panel {
      width: min(100%, 300px);
      margin: auto;
    }
  </style>
</head>
<body>
  <div id="panel"></div>
  <script type="module">
    import settings from '../../index.js'
    import controlPanel from '../../theme/control-panel.js'

    // Read hash params: #shade=ebebeb&accent=5b99f5
    const params = Object.fromEntries(location.hash.slice(1).split('&').filter(Boolean).map(s => s.split('=')))
    const accent = params.accent ? '#' + params.accent : undefined

    // Dark / light shades — toggled live by the in-panel switch
    const DARK = '#232323', LIGHT = '#ebebeb'
    const isLight = (hex) => {
      const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16))
      return (r + g + b) / 3 > 128
    }
    const initialDark = params.shade ? !isLight('#' + params.shade) : true

    const DARK_BG = 'radial-gradient(120% 90% at 50% -10%, #2e2e2e 0%, #1a1a1a 55%, #0f0f0f 100%)'
    const LIGHT_BG = 'radial-gradient(120% 90% at 50% -10%, #c4c4c4 0%, #999999 55%, #7a7a7a 100%)'
    const setBodyBg = (dark) => document.body.style.background = dark ? DARK_BG : LIGHT_BG
    setBodyBg(initialDark)

    settings({
      'dark': { type: 'boolean', variant: 'switch', value: initialDark, label: 'dark mode' },
      'range slider': { type: 'slider', value: 20, min: 0, max: 100, step: 1, label: 'range slider' },
      'stepped slider': { type: 'slider', value: 0.6, min: 0, max: 1, step: 0.2, label: 'stepped slider' },
      'interval': { type: 'slider', multiple: true, value: [25, 50], min: 0, max: 100, step: 1, label: 'interval' },
      'text': { type: 'text', value: 'my setting', label: 'text' },
      'checkbox': { type: 'boolean', variant: 'checkbox', value: true, label: 'checkbox' },
      'color rgb': { type: 'color', value: '#64c864', label: 'color rgb' },
      'color hex': { type: 'color', value: '#30b2ba', label: 'color hex' },
      'gimme an alert': { type: 'button', text: 'gimme an alert', label: '', onClick: () => alert('hello!') },
      'selection': { type: 'select', options: ['option 1', 'option 2'], value: 'option 1', label: 'selection' },
      'multiple checkboxes': {
        type: 'select', variant: 'checkboxes', multiple: true,
        value: ['x'],
        options: [
          { value: 'x', style: '--s-color:#e35' },
          { value: 'y', style: '--s-color:#3a3' },
          { value: 'z', style: '--s-color:#38e' },
        ],
        label: 'multiple checkboxes'
      },
    }, {
      container: '#panel',
      theme: (s) => controlPanel({ shade: s.dark ? DARK : LIGHT, accent }),
      title: 'example panel',
      onchange(s) { setBodyBg(s.dark) },
    })
  </script>
</body>
</html>
