<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glass — Glassmorphism</title>
  <script type="importmap">
  {
    "imports": {
      "sprae": "https://esm.sh/sprae@13",
      "sprae/store": "https://esm.sh/sprae@13/store"
    }
  }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; }
    html { min-height: 100%; scrollbar-width: none; }
    ::-webkit-scrollbar { display: none; }
    body {
      min-height: 100svh;
      display: flex;
      padding: 32px 16px;
      font-size: 14px;
      position: relative;
      isolation: isolate;
      background: #120e1c;
    }
    /* Backdrop: broad mineral colour fields, so the pane has colour to
       lift and bend inside it. A single thin light streak crosses under the
       panel — a straight line is the clearest tell that the rim refracts. */
    body::before, body::after {
      content: ''; position: absolute; inset: 0; z-index: 0; pointer-events: none;
    }
    body::before {
      background:
        radial-gradient(42rem 34rem at 22% 18%, #698f89 0%, transparent 62%),
        radial-gradient(38rem 32rem at 82% 16%, #344d62 0%, transparent 62%),
        radial-gradient(44rem 36rem at 74% 88%, #528590 0%, transparent 62%),
        radial-gradient(34rem 30rem at 18% 86%, #b7a483 0%, transparent 58%),
        radial-gradient(30rem 24rem at 50% 52%, #2c444a 0%, transparent 65%);

    }
    body::after {
      background:
        linear-gradient(112deg, transparent 48.2%, rgba(255,255,255,.32) 49.7%, rgba(255,255,255,.32) 50.3%, transparent 51.8%),
        linear-gradient(112deg, transparent 59%, rgba(255,255,255,.14) 60.6%, rgba(255,255,255,.14) 61%, transparent 62.6%);
      mix-blend-mode: screen;

    }
    #panel { margin: auto; width: min(100%, 380px); position: relative; z-index: 1; }
  </style>
</head>
<body>
  <!-- Liquid Glass refraction filter — displaces the backdrop outward near the
       panel's edges (flat/undistorted at the centre), then softens + saturates.

       The displacement map is a single feImage: two linear gradients (one
       encoding x-displacement in R, one encoding y-displacement in G) painted
       into ONE self-contained SVG and combined there with CSS
       mix-blend-mode:plus-lighter (additive — R and G stay independent, B
       is a constant 0.5 baked into both so it cancels out as the neutral
       "no displacement" value). This is deliberate: combining the two
       gradients with an *outer* feComposite(operator=arithmetic) primitive
       and feeding that into feDisplacementMap was verified in this Chromium
       build to silently no-op (feComposite's own output renders correctly
       when it IS the filter's result, but feDisplacementMap reads it as flat
       neutral gray when it's chained as an *input*) — pre-blending inside a
       single feImage sidesteps that bug entirely.

       Referenced two ways: (1) `backdrop-filter: url(#lg-refraction)` per the
       reference-filter spec — the spec-correct, future-proof path, bakes its
       own blur+saturate so nothing is lost if a browser executes
       feDisplacementMap there. (2) `filter: url(#lg-refraction)` — verified
       in this Chromium build to be the path that reliably renders the bend;
       used on the panel's dedicated ::after backdrop layer (see
       theme/glass.js) so only the glass bends, never the text on top of it. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <filter id="lg-refraction" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
        <feImage x="0" y="0" width="100%" height="100%" preserveAspectRatio="none" result="lg-map"
          href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='gx' x1='0' y1='0' x2='1' y2='0'%3E%3Cstop offset='0' stop-color='rgb(0,0,64)'/%3E%3Cstop offset='0.22' stop-color='rgb(64,0,64)'/%3E%3Cstop offset='0.78' stop-color='rgb(64,0,64)'/%3E%3Cstop offset='1' stop-color='rgb(255,0,64)'/%3E%3C/linearGradient%3E%3ClinearGradient id='gy' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='rgb(0,0,64)'/%3E%3Cstop offset='0.22' stop-color='rgb(0,64,64)'/%3E%3Cstop offset='0.78' stop-color='rgb(0,64,64)'/%3E%3Cstop offset='1' stop-color='rgb(0,255,64)'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' fill='url(%23gx)'/%3E%3Crect width='100' height='100' fill='url(%23gy)' style='mix-blend-mode:plus-lighter'/%3E%3C/svg%3E" />
        <feGaussianBlur in="lg-map" stdDeviation="4" result="lg-map-soft" />
        <feDisplacementMap in="SourceGraphic" in2="lg-map-soft" scale="34" xChannelSelector="R" yChannelSelector="G" result="lg-bent" />
        <feGaussianBlur in="lg-bent" stdDeviation="1" result="lg-blur" />
        <feColorMatrix in="lg-blur" type="saturate" values="1.25" />
      </filter>
    </defs>
  </svg>
  <div id="panel"></div>
  <script type="module">
    import settings from '../../index.js'
    import glass from '../../theme/glass.js'

    if (location.hash === '#lens') document.getElementById('panel').style.setProperty('--glass-refraction', 'url(#lg-refraction)')

    settings({
      title: { type: 'text', value: 'Northern Lights', label: 'Title' },
      blend: { type: 'select', value: 'Screen', options: ['Normal', 'Screen', 'Overlay', 'Soft Light'], label: 'Blend' },
      opacity: { type: 'slider', value: 0.82, min: 0, max: 1, label: 'Opacity' },
      blur: { type: 'slider', value: 18, min: 0, max: 40, step: 1, label: 'Blur', unit: 'px' },
      frosted: { type: 'boolean', variant: 'switch', value: true, label: 'Frosted' },
      tint: { type: 'color', variant: 'rgba', value: '#6ea8ffd9', label: 'Tint' },
      mode: { type: 'select', variant: 'segmented', value: 'auto', options: ['light', 'auto', 'dark'], label: 'Mode' },
      div: { type: 'separator' },
      memory: { type: 'info', value: 128, format: v => v + ' MB', label: 'GPU memory' },
      apply: { type: 'button', label: false, text: 'Apply effect' },
    }, {
      container: '#panel',
      title: 'Layer',
      collapsed: false,
      search: true,
      theme: () => glass({ shade: '#1e3035', accent: '#b6d9cf' }),
    })
  </script>
</body>
</html>
