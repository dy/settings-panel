<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings Panel — Gallery</title>
  <script type="importmap">
  { "imports": { "sprae": "https://esm.sh/sprae@13" } }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #111;
      color: #999;
      min-height: 100vh;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      border-top: 1px solid #222;
    }

    @media (max-width: 1100px) {
      .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 640px) {
      .gallery { grid-template-columns: 1fr; }
    }

    .cell {
      position: relative;
      border-right: 1px solid #222;
      border-bottom: 1px solid #222;
      display: flex;
      flex-direction: column;
      min-height: 700px;
    }
    .cell:nth-child(3n) { border-right: none; }

    .cell-label {
      font-size: .625rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .1em;
      text-align: center;
      padding: .5rem;
      color: #aaa;
      background: #111;
      text-decoration: none ;
    }

    .cell iframe {
      flex: 1;
      width: 100%;
      border: none;
    }

    .cell-placeholder {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .75rem;
      color: #333;
      background: #1a1a1a;
    }
  </style>
</head>
<body>

<div class="gallery" id="gallery">
  <div class="cell" :each="c in cases">
    <a :href="c.src || '#'" class="cell-label" :text="c.label"></a>
    <iframe :if="c.src" :src="c.src" :title="c.label" loading="lazy"></iframe>
    <div :if="!c.src" class="cell-placeholder" :text="c.label + ' — not yet'"></div>
  </div>
</div>

<script type="module">
  import sprae from 'sprae'

  // serve serves this index at both /demo/cases/ and /demo/cases (it redirects
  // index.html, dropping the slash) — resolve case URLs against this dir either way.
  const dir = location.pathname.endsWith('/') ? '' : 'cases/'

  sprae(gallery, { cases: [
    { label: 'lab', src: dir + 'lab.html' },
    { label: 'studio', src: dir + 'studio.html' },
    { label: 'material study', src: dir + 'materials.html' },
    { label: 'porcelain', src: dir + 'variants.html#porcelain' },
    { label: 'editorial', src: dir + 'editorial.html' },
    { label: 'retro / win98', src: dir + 'win98.html' },
    { label: 'bitmap / macintosh', src: dir + 'macintosh.html' },
    { label: 'swiss', src: dir + 'swiss.html' },
    { label: 'control-panel', src: dir + 'control-panel.html' },
    { label: 'dat.gui', src: dir + 'dat.html' },
    { label: 'imgui', src: dir + 'imgui.html' },
    { label: 'tweakpane', src: dir + 'tweakpane.html' },
    { label: 'dialkit', src: dir + 'dialkit.html' },
    { label: 'leva', src: dir + 'leva.html' },
    { label: 'controlkit', src: dir + 'controlkit.html' },
    { label: 'uil', src: dir + 'uil.html' },
    { label: 'oui', src: dir + 'oui.html' },
    { label: 'tracked', src: dir + 'tracked.html' },
  ]})
</script>

</body>
</html>
