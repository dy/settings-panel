<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tweakpane — calibration</title>
  <!-- Replica of the Tweakpane canonical example · ref: https://tweakpane.github.io/docs/ -->
  <script type="importmap">
  {
    "imports": {
      "sprae": "https://esm.sh/sprae@13",
      "sprae/store": "https://esm.sh/sprae@13/store"
    }
  }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html { height: 100%; overflow: hidden; }
    body {
      height: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 0 0;
      background: radial-gradient(120% 120% at 70% 10%, #3a4a63, #1b2230);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="panel"></div>
  <script type="module">
    import settings from '../../index.js'
    import tweakpane from '../../theme/tweakpane.js'

    settings({
      wave: { type: 'select', value: 'sine', options: ['sine', 'triangle', 'sawtooth', 'square'], label: 'wave' },
      speed: { type: 'slider', value: 0.5, min: 0, max: 1, step: 0.01, label: 'speed' },
      spread: { type: 'slider', value: 28, min: 0, max: 100, step: 1, label: 'spread' },
      offset: { type: 'xy', value: [0.3, 0.6], min: 0, max: 1, step: 0.01, label: 'offset' },
      scale: { type: 'vector', value: [1, 1], min: 0, max: 4, step: 0.1, label: 'scale' },
      background: { type: 'color', value: '#1c3f6e', label: 'background' },
      advanced: { type: 'folder', label: 'ADVANCED' },
      'advanced.gain': { type: 'slider', value: 0.7, min: 0, max: 1, step: 0.01, label: 'gain' },
      'advanced.loop': { type: 'boolean', variant: 'checkbox', value: true, label: 'loop' },
      fps: { type: 'info', value: 61.8, format: v => v.toFixed(2), label: 'fps' },
      export: { type: 'button', label: false, text: 'Export' },
    }, {
      container: '#panel',
      theme: () => tweakpane(),
    })
  </script>
</body>
</html>
