<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tweakpane — calibration</title>
  <!-- Replica of the Tweakpane canonical example · ref: https://tweakpane.github.io/docs/ -->
  <script type="importmap">
  {
    "imports": {
      "sprae": "https://esm.sh/sprae@13",
      "sprae/store": "https://esm.sh/sprae@13/store"
    }
  }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html { height: 100%; overflow: hidden; }
    body {
      height: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 0 0;
      background: radial-gradient(120% 120% at 70% 10%, #3a4a63, #1b2230);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="panel"></div>
  <script type="module">
    import settings from '../../index.js'
    import tweakpane from '../../theme/tweakpane.js'
    import { nativeToggle } from './native-toggle.js'

    settings({
      wave: { type: 'select', value: 'sine', options: ['sine', 'triangle', 'sawtooth', 'square'], label: 'wave' },
      speed: { type: 'slider', value: 0.5, min: 0, max: 1, step: 0.01, format: v => v.toFixed(2), label: 'speed' },
      spread: { type: 'slider', value: 28, min: 0, max: 100, step: 1, label: 'spread' },
      position: { type: 'vector', value: [0.2, -0.4], labels: false, min: [-1, 1], max: [1, -1], step: 0.01, pad: true, label: 'position' },
      background: { type: 'color', variant: 'rgba', value: 'rgba(28, 63, 110, 0.8)', label: 'background' },
      name: { type: 'text', value: 'voice', label: 'name' },
      count: { type: 'slider', value: 4, min: 0, max: 12, step: 1, label: 'count' },
      sep1: { type: 'separator' },
      advanced: { type: 'folder', label: 'ADVANCED', collapsed: false },
      'advanced.gain': { type: 'slider', value: 0.7, min: 0, max: 1, step: 0.01, format: v => v.toFixed(2), label: 'gain' },
      'advanced.mode': { type: 'select', value: 'normal', options: ['slow', 'normal', 'fast'], label: 'mode' },
      'advanced.loop': { type: 'boolean', variant: 'checkbox', value: true, label: 'loop' },
      'advanced.locked': { type: 'boolean', variant: 'checkbox', value: false, label: 'locked', disabled: true },
      tone: { type: 'folder', label: 'TONE', collapsed: false },
      'tone.detune': { type: 'slider', value: 12, min: -50, max: 50, step: 1, label: 'detune' },
      fps: { type: 'info', value: 61.8, format: v => v.toFixed(2), label: 'fps' },
      export: { type: 'button', label: false, text: 'Export' },
    }, {
      container: '#panel',
      theme: () => tweakpane(),
    })

    nativeToggle({ ref: '../_ref/tp.html' })
  </script>
</body>
</html>
