<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings Panel — Controls</title>
    <!-- Every control, every variant and every field option, in any theme, shade and accent: the page themes are checked on. -->
    <script type="importmap">
    {
      "imports": {
        "sprae": "https://esm.sh/sprae@13.9.2",
        "sprae/store": "https://esm.sh/sprae@13.9.2/store"
      }
    }
    </script>
    <style>
      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        font-family: system-ui;
        background: var(--ground, oklch(from var(--bg, oklch(.96 0 0)) calc(l - 0.1) c h));
        padding: 4rem 2rem 2rem;
      }

      .theme-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: .5rem 1rem;
        padding: .5rem .75rem;
        font: 13px system-ui;
        color: light-dark(#222, #eee);
        background: light-dark(#f4f4f4ee, #1c1c1cee);
        border-bottom: 1px solid light-dark(#0002, #fff2);
      }
      .theme-bar label { display: inline-flex; align-items: center; gap: .4rem; }
      .theme-bar select, .theme-bar button { font: inherit; padding: 2px 6px; }
      .theme-bar input[type="color"] { width: 28px; height: 22px; padding: 0; border: 1px solid #0003; border-radius: 4px; background: none; }
      .theme-bar input[type="checkbox"] { margin: 0; }

      #panel { width: min(100%, 360px); }

      /* a planned control's placeholder */
      .s-stub {
        display: flex;
        align-items: center;
        gap: .4em;
        padding: 6px 8px;
        border: 1px dashed color-mix(in oklab, currentColor 25%, transparent);
        border-radius: 4px;
        opacity: .5;
        font-size: .8em;
        font-style: italic;
        svg { flex: none; width: 1.1em; height: 1.1em; }
      }
    </style>
  </head>

  <body>
    <div class="theme-bar">
      <label>theme <select id="theme-picker"></select></label>
      <label><input type="checkbox" id="use-shade"> shade <input type="color" id="shade" value="#f2f2f0"></label>
      <label><input type="checkbox" id="use-accent"> accent <input type="color" id="accent" value="#2563eb"></label>
      <button id="open-all" type="button">Open all</button>
    </div>
    <div id="panel"></div>

    <script type="module">
      import settings, { register } from '../index.js'
      import control from '../control/control.js'
      import { themes as registry, byId } from './themes.js'

      // ── Planned control types: a placeholder row each ──
      const draft = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="2 2"><rect x="2" y="2" width="12" height="12" rx="2"/></svg>`
      for (const t of ['font', 'file', 'graph', 'curve', 'custom']) {
        register(t, (sig, opts) => control(sig, { ...opts, template: `<span class="s-stub"><i :html="icon"></i><span :text="stubLabel"></span></span>`, icon: draft, stubLabel: t + ': planned' }))
      }

      const log = (...a) => console.log('[controls]', ...a)
      const glyph = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`
      const icons = {
        search: glyph('<circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/>'),
        play: glyph('<path d="M8 5v14l11-7z"/>'),
        trash: glyph('<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'),
      }
      const folder = label => ({ type: 'folder', collapsed: true, label })

      const schema = {
        // ── Inferred: plain values, no type given ──
        inferred: folder('Inferred from values'),
        'inferred.name': 'Bloop',
        'inferred.count': 7,
        'inferred.volume': 0.75,
        'inferred.active': true,
        'inferred.tint': '#4488cc',
        'inferred.overlay': [32, 128, 255, 0.5],
        'inferred.species': ['Cat', 'Dog', 'Parrot', 'Fish'],
        'inferred.bounded': { min: 0, max: 10, value: 4 },

        // ── Text ──
        text: folder('Text'),
        'text.label': { type: 'text', value: 'Hello world', label: 'Basic' },
        'text.search': { type: 'text', value: '', placeholder: 'Search…', label: 'Placeholder' },
        'text.longValue': { type: 'text', value: 'A longer value that runs past the end of its field and wraps where the theme lets it', label: 'Long value' },

        // ── Number ──
        num: folder('Number'),
        'num.quantity': { type: 'number', value: 42, label: 'Basic' },
        'num.rating': { type: 'number', value: 7, min: 0, max: 10, step: 1, label: 'Bounded (0–10)' },
        'num.price': { type: 'number', value: 9.99, min: 0, step: 0.01, label: 'Float (0.01 step)' },
        'num.large': { type: 'number', value: 1280000, step: 1000, label: 'Large' },
        'num.scrub': { type: 'number', value: 12, step: 1, scrub: true, label: 'Scrub the field' },

        // ── Slider ──
        sl: folder('Slider'),
        'sl.brightness': { type: 'slider', value: 50, min: 0, max: 100, step: 1, label: 'Linear' },
        'sl.masterOpacity': { type: 'slider', value: 0.8, min: 0, max: 1, step: 0.01, label: 'Normalized (0–1)' },
        'sl.gridSnap': { type: 'slider', value: 0.6, min: 0, max: 1, step: 0.2, marks: true, label: 'Stepped + marks' },
        'sl.temperature': { type: 'slider', value: 50, min: 0, max: 100, step: 1, marks: { 0: 'Cold', 25: 'Cool', 50: 'Warm', 75: 'Hot', 100: 'Boil' }, label: 'Labeled marks' },
        'sl.snapPoints': { type: 'slider', value: 50, min: 0, max: 100, step: [0, 25, 50, 75, 100], marks: true, label: 'Discrete snap' },
        'sl.marksEnds': { type: 'slider', value: 50, min: 0, max: 100, step: 1, marks: 'ends', label: 'Marks: ends only' },
        'sl.frequency': { type: 'slider', value: 440, min: 20, max: 20000, scale: 'log', unit: ' Hz', label: 'Logarithmic' },
        'sl.acceleration': { type: 'slider', value: 0.3, min: 0, max: 1, step: 0.01, curve: 2, label: 'Exp curve (power 2)' },
        'sl.deceleration': { type: 'slider', value: 0.7, min: 0, max: 1, step: 0.01, curve: 0.5, label: 'Log curve (power 0.5)' },
        'sl.tempRange': { type: 'slider:range', value: [18, 24], min: -10, max: 50, step: 1, unit: '°', label: 'Range' },
        'sl.level': { type: 'slider', value: 66, min: 0, max: 100, step: 1, readout: 'readonly', label: 'Readonly readout' },
        'sl.gain': { type: 'slider', value: 33, min: 0, max: 100, step: 1, readout: 'tooltip', label: 'Tooltip readout' },
        'sl.completion': { type: 'slider', value: 72, min: 0, max: 100, step: 1, readout: v => Math.round(v) + '%', label: 'Custom format' },
        'sl.noReadout': { type: 'slider', value: 50, min: 0, max: 100, step: 1, readout: false, label: 'No readout' },

        // ── Boolean ──
        bool: folder('Boolean'),
        'bool.notifications': { type: 'boolean', variant: 'switch', value: true, label: 'Switch' },
        'bool.agreed': { type: 'boolean', variant: 'checkbox', value: false, label: 'Checkbox' },
        'bool.darkMode': { type: 'boolean', variant: 'toggle', value: true, label: 'Toggle' },

        // ── Select ──
        sel: folder('Select'),
        'sel.category': { type: 'select', variant: 'dropdown', options: ['Bug', 'Feature', 'Docs', 'Chore'], value: 'Feature', label: 'Dropdown' },
        'sel.longOption': { type: 'select', options: ['A very long option that will not fit', 'Short'], value: 'A very long option that will not fit', label: 'Long option' },
        'sel.toggle': { type: 'select', variant: 'segmented', options: ['On', 'Off'], value: 'On', label: 'Segmented (2)' },
        'sel.mode': { type: 'select', variant: 'segmented', options: ['Light', 'Dark', 'Auto'], value: 'Auto', label: 'Segmented (3)' },
        'sel.size': { type: 'select', variant: 'segmented', options: ['XS', 'S', 'M', 'L', 'XL'], value: 'M', label: 'Segmented (5)' },
        'sel.alignment': { type: 'select', variant: 'radio', options: ['Left', 'Center', 'Right'], value: 'Left', label: 'Radio' },
        'sel.features': { type: 'select', variant: 'checkboxes', multiple: true, options: ['Bold', 'Italic', 'Underline', 'Strike'], value: ['Bold'], label: 'Checkboxes' },
        'sel.colored': {
          type: 'select', variant: 'checkboxes', multiple: true,
          options: [{ value: 'x', label: 'X', style: '--s-color:#e35' }, { value: 'y', label: 'Y', style: '--s-color:#3a3' }, { value: 'z', label: 'Z', style: '--s-color:#38e' }],
          value: ['x'], label: 'Colored checkboxes'
        },

        // ── Color ──
        clr: folder('Color'),
        'clr.foreground': { type: 'color', variant: 'picker', value: '#e35050', label: 'Picker' },
        'clr.background': { type: 'color', variant: 'picker', value: '#2a4a6b', label: 'Picker (dark)' },
        'clr.glass': { type: 'color', variant: 'rgba', value: '#2a4a6b80', label: 'RGBA' },
        'clr.palette': { type: 'color', variant: 'swatches', value: '#0080ff', label: 'Swatches' },
        'clr.custom': { type: 'color', variant: 'swatches', value: '#ff6600', colors: ['#ff6600', '#ff0066', '#6600ff', '#0066ff', '#00ff66', '#ffffff'], label: 'Swatches (custom)' },

        // ── Vector, pad, knob ──
        vec: folder('Vector, pad, knob'),
        'vec.position': { type: 'vector', value: [0, 0], labels: ['X', 'Y'], label: 'Vector 2D' },
        'vec.rotation': { type: 'vector', value: [0, 90, 180], min: 0, max: 360, step: 1, label: 'Vector 3D' },
        'vec.anchor': { type: 'vector', value: [0.3, 0.7], labels: ['x', 'y'], min: 0, max: 1, step: 0.01, pad: 'open', label: 'Vector + pad' },
        'vec.pad': { type: 'xy', value: [0.3, 0.7], min: 0, max: 1, label: 'XY pad' },
        'vec.knob': { type: 'knob', value: 0.6, min: 0, max: 1, step: 0.01, label: 'Knob' },
        'vec.freq': { type: 'knob', value: 440, min: 20, max: 2000, step: 1, unit: ' Hz', label: 'Knob (unit)' },

        // ── Code and long text ──
        code: folder('Code and long text'),
        'code.notes': { type: 'textarea', value: 'Multi-line\ntext area\ninput', label: 'Textarea' },
        'code.snippet': { type: 'textarea', variant: 'code', value: 'const x = 42\nreturn x * 2', label: 'Code' },
        'code.output': { type: 'textarea', value: 'Read-only content.\nCannot be edited.', readonly: true, label: 'Readonly' },

        // ── Info ──
        info: folder('Info'),
        'info.status': { type: 'info', value: 'Ready', label: 'Status' },
        'info.fps': { type: 'info', value: '60 fps', label: 'Frame rate' },
        'info.remark': { type: 'info', value: 'Read-only text that may run to a second line when it is long', label: 'Note' },

        // ── Buttons ──
        btn: folder('Buttons'),
        'btn.run': { type: 'button', text: 'Run', onClick: () => log('clicked'), label: 'Action' },
        'btn.ops': { type: 'button', label: 'Group', buttons: { Save: () => log('save'), Reset: { variant: 'secondary', onclick: () => log('reset') } } },
        'btn.icons': { type: 'button', label: 'Icons', buttons: [{ icon: icons.search, name: 'Search', onClick() {} }, { icon: icons.play, text: 'Play', onClick() {} }, { icon: icons.trash, name: 'Delete', onClick() {} }] },
        'btn.upload': { type: 'button', text: 'Upload', onClick: () => new Promise(r => setTimeout(r, 1500)), label: 'Async (loading)' },
        'btn.off': { type: 'button', text: 'Unavailable', disabled: true, label: 'Disabled' },
        'btn.infer': { Run: () => log('inferred btn group'), Clear: () => log('cleared') },

        // ── Field options ──
        field: folder('Field options'),
        'field.basic': { type: 'text', value: 'Just a label', label: 'Label' },
        'field.hinted': { type: 'text', value: 'With hint below', label: 'Hinted', hint: 'Extra context for the field' },
        'field.titled': { type: 'text', value: 'Hover the ?', label: 'Tooltip', title: 'This appears as a tooltip on hover' },
        'field.longLabel': { type: 'text', value: 'Value', label: 'A label long enough to wrap onto a second line' },
        'field.locked': { type: 'text', value: 'Cannot edit', label: 'Disabled', disabled: true },
        'field.noLabel': { type: 'text', value: 'Full-width input', label: false },
        'field.hintOnly': { type: 'slider', value: 50, min: 0, max: 100, step: 1, label: 'Slider', hint: 'Hints work on any control' },
        'field.disabledToggle': { type: 'boolean', variant: 'switch', value: true, label: 'Disabled switch', disabled: true },

        // ── Layout: separators, sections, nesting ──
        layout: folder('Layout'),
        'layout.before': { type: 'text', value: 'Above a rule', label: 'Row' },
        'layout.rule': { type: 'separator' },
        'layout.after': { type: 'text', value: 'Below a rule', label: 'Row' },
        'layout.heading': { type: 'separator', label: 'Labeled separator' },
        'layout.under': { type: 'slider', value: 30, min: 0, max: 100, label: 'Row' },

        sect: { type: 'folder', variant: 'section', label: 'Section (always open)' },
        'sect.note': { type: 'text', value: 'Headings that never fold', label: 'Note' },
        'sect.dial': { type: 'slider', value: 50, min: 0, max: 100, step: 1, label: 'Control' },

        // ── Planned ──
        planned: folder('Planned controls'),
        'planned.typeface': { type: 'font', value: 'Inter', label: 'Font' },
        'planned.attachment': { type: 'file', value: null, label: 'File' },
        'planned.signal': { type: 'graph', value: 0, label: 'Graph' },
        'planned.easing': { type: 'curve', value: [0.4, 0, 0.2, 1], label: 'Curve' },
        'planned.widget': { type: 'custom', value: null, label: 'Custom' },
      }

      const picker = document.getElementById('theme-picker')
      const shade = document.getElementById('shade'), useShade = document.getElementById('use-shade')
      const accent = document.getElementById('accent'), useAccent = document.getElementById('use-accent')

      let state
      function create() {
        const open = [...document.querySelectorAll('.s-folder')].filter(f => f.open).map(f => f.dataset.key)
        state?.[Symbol.dispose]()
        const t = byId[picker.value]
        state = settings(schema, {
          container: '#panel',
          theme: t.fn({ ...(useShade.checked && { shade: shade.value }), ...(useAccent.checked && { accent: accent.value }) }),
          title: 'Controls',
          onChange: s => log('state', JSON.parse(JSON.stringify(s))),
        })
        // folders that were open stay open (through their own toggle, which keeps its state)
        for (const key of open) document.querySelector(`.s-folder[data-key="${key}"]:not([open]) > summary`)?.click()
        // the page takes the panel's colour a step darker; a transparent theme (swiss) takes its own ground
        const el = document.querySelector('.s-panel'), bg = el && getComputedStyle(el).getPropertyValue('--bg').trim()
        // the bar reads on any page: its colours follow the panel's light or dark scheme
        document.documentElement.style.colorScheme = getComputedStyle(el).colorScheme.includes('dark') || getComputedStyle(el).color.match(/\d+/g)?.slice(0, 3).reduce((a, b) => a + +b, 0) > 382 ? 'dark' : 'light'
        document.documentElement.style.setProperty('--bg', !bg || bg === 'transparent' ? 'oklch(.96 0 0)' : bg)
        document.documentElement.style.setProperty('--ground', t.ground || (bg === 'transparent' ? `oklch(from ${getComputedStyle(el).color} calc(1 - l) 0 h)` : ''))
        if (!t.ground && bg !== 'transparent') document.documentElement.style.removeProperty('--ground')
      }

      for (const t of registry) picker.append(new Option(t.name, t.id))
      picker.value = 'soft'
      picker.addEventListener('change', create)
      for (const el of [shade, accent]) el.addEventListener('input', () => { (el === shade ? useShade : useAccent).checked = true; create() })
      for (const el of [useShade, useAccent]) el.addEventListener('change', create)
      document.getElementById('open-all').addEventListener('click', () => {
        const folders = [...document.querySelectorAll('.s-folder:not(.s-section)')], open = folders.some(f => !f.open)
        for (const f of folders) if (f.open !== open) f.querySelector(':scope > summary').click()
      })

      create()
    </script>
  </body>

</html>
